# Rotaryplay startup config -- read by run.sh (every start) and install.sh.
# These are the things that need a restart: network, files, ports.
# Empty = the default (in brackets).
#
# Every setting on the web page's tabs is also a flag and can go in
# EXTRA_FLAGS, e.g. EXTRA_FLAGS="--brightness 120 --cc-on --seq-start-on".
# A flag here wins over the page's saved settings at every start; the page
# can still change it live afterwards. List them all: ./run.sh --help

TEENSY_IP=          # Teensy address [teensyIP in teensy.ino: 192.168.60.50]
TEENSY_PORT=        # Teensy UDP port [LISTEN_PORT in teensy.ino: 5005]
TEENSY_SERIAL=      # Teensy USB serial, read for stats [/dev/ttyACM0]
ETH_IF=eth0         # Pi interface cabled to the Teensy (install.sh)
PI_IP=192.168.60.20/24   # Pi address on that interface (install.sh)
WEB_PORT=           # control page port, 0 = off [8099]
SKETCH=             # sketch the wall is read from [teensy.ino next to fan_wall.py]
STATE_FILE=         # saved settings [fan_wall_state.json next to fan_wall.py]
UPLOAD_DIR=         # uploaded media [uploads/ next to fan_wall.py]
MEDIA=              # a video/image to add to the queue at start
FONT=               # primary .ttf/.otf [DejaVu Sans; CJK falls back to VL Gothic / Noto CJK]
FPS=                # output frame rate [30]
EXTRA_FLAGS=""
